# Node2: AcmeCorp counterparty B (local dev network).
myLegalName = "O=Node2, L=London, C=GB"
p2pAddress = "node2:10200"
detectPublicIp = false
devMode = true
crlCheckSoftFail = true
jarDirs = [ "/opt/corda/drivers" ]
cordappDirectories = [ "/var/lib/corda/cordapps", "/opt/corda/cordapps-baked" ]

rpcSettings {
    address = "0.0.0.0:10201"
    adminAddress = "0.0.0.0:10202"
}

rpcUsers = [
    { username = "corda", password = "dev-rpc-password", permissions = ["ALL"] }
]

dataSourceProperties {
    dataSourceClassName = "org.postgresql.ds.PGSimpleDataSource"
    dataSource.url = "jdbc:postgresql://postgres:5432/cordanode2"
    dataSource.user = "corda"
    dataSource.password = "devpassword"
}
