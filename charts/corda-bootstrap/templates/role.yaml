apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "corda-bootstrap.serviceAccountName" . }}
  labels:
    {{- include "corda-bootstrap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, create, update, patch, apply]
