apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corda-bootstrap.fullname" . }}-passwords
  labels:
    {{- include "corda-bootstrap.labels" . | nindent 4 }}
type: Opaque
stringData:
  RPC_PASSWORD: {{ .Values.passwords.rpc | quote }}
  KEYSTORE_PASSWORD: {{ .Values.passwords.keystore | quote }}
  TRUSTSTORE_PASSWORD: {{ .Values.passwords.truststore | quote }}
