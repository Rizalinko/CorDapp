{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
# Chart-created Secret — for trials only. In production reference an existing
# Secret synced from Azure Key Vault / AWS Secrets Manager (see Part 6).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corda-node.secretName" . }}
  labels:
    {{- include "corda-node.labels" . | nindent 4 }}
type: Opaque
stringData:
  rpc-password: {{ index .Values.secrets.data "rpc-password" | quote }}
  db-password: {{ index .Values.secrets.data "db-password" | quote }}
  keystore-password: {{ index .Values.secrets.data "keystore-password" | quote }}
  truststore-password: {{ index .Values.secrets.data "truststore-password" | quote }}
{{- end }}
