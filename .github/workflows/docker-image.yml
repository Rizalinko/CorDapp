name: docker-image

# Part 1 CI: lint the Dockerfiles/scripts, build both images, scan with Trivy,
# and smoke-test the full local network with docker-compose.
# Part 5 adds the release job: push to GHCR with semver+SHA tags and sign
# with cosign keyless signing (Sigstore OIDC, no key management required).

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - compose/**
      - scripts/wait-healthy.sh
      - docker-compose.yml
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - docker/**
      - compose/**
      - scripts/wait-healthy.sh
      - docker-compose.yml
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  JAR_IMAGE: corda-jar:ci
  NODE_IMAGE: corda-node:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (jar-image)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/jar-image/Dockerfile
      - name: hadolint (node-image)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/node-image/Dockerfile
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .

  build-scan-smoke:
    needs: lint
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build jar-image
        uses: docker/build-push-action@v6
        with:
          context: docker/jar-image
          push: true
          tags: localhost:5000/corda-jar:ci
          cache-from: type=gha,scope=jar
          cache-to: type=gha,mode=max,scope=jar

      - name: Build node-image
        uses: docker/build-push-action@v6
        with:
          context: docker/node-image
          load: true
          tags: ${{ env.NODE_IMAGE }}
          build-args: |
            JAR_IMAGE=localhost:5000/corda-jar:ci
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

      - name: Trivy scan (node-image)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.NODE_IMAGE }}
          format: sarif
          output: trivy-node.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignore: .trivyignore
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-node.sarif
          category: trivy-node-image

      - name: Smoke test — bring up the local network
        run: NODE_IMAGE=${{ env.NODE_IMAGE }} docker compose up -d

      - name: Wait for all nodes to become healthy
        run: TIMEOUT=600 ./scripts/wait-healthy.sh notary node1 node2

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  release:
    needs: build-scan-smoke
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    env:
      JAR_REPO: ghcr.io/acmecorp/corda-jar
      NODE_REPO: ghcr.io/acmecorp/corda-node
      CORDA_VERSION: "4.14.0"
    outputs:
      node_tag: ${{ steps.tag.outputs.node_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tag
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c7)
          CORDA="${{ env.CORDA_VERSION }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            {
              echo "jar_tags<<EOF"
              printf '%s\n' \
                "${{ env.JAR_REPO }}:${CORDA}" \
                "${{ env.JAR_REPO }}:latest"
              echo "EOF"
              echo "node_tags<<EOF"
              printf '%s\n' \
                "${{ env.NODE_REPO }}:${CORDA}" \
                "${{ env.NODE_REPO }}:latest"
              echo "EOF"
              echo "node_tag=${CORDA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "jar_tags<<EOF"
              printf '%s\n' \
                "${{ env.JAR_REPO }}:${CORDA}-${SHA}" \
                "${{ env.JAR_REPO }}:dev"
              echo "EOF"
              echo "node_tags<<EOF"
              printf '%s\n' \
                "${{ env.NODE_REPO }}:${CORDA}-${SHA}" \
                "${{ env.NODE_REPO }}:dev"
              echo "EOF"
              echo "node_tag=${CORDA}-${SHA}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push jar-image
        id: push-jar
        uses: docker/build-push-action@v6
        with:
          context: docker/jar-image
          push: true
          tags: ${{ steps.tag.outputs.jar_tags }}
          cache-from: type=gha,scope=jar
          cache-to: type=gha,mode=max,scope=jar

      - name: Build and push node-image
        id: push-node
        uses: docker/build-push-action@v6
        with:
          context: docker/node-image
          push: true
          tags: ${{ steps.tag.outputs.node_tags }}
          build-args: JAR_IMAGE=${{ env.JAR_REPO }}@${{ steps.push-jar.outputs.digest }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

      - uses: sigstore/cosign-installer@v3

      - name: Sign jar-image
        run: cosign sign --yes "${{ env.JAR_REPO }}@${{ steps.push-jar.outputs.digest }}"

      - name: Sign node-image
        run: cosign sign --yes "${{ env.NODE_REPO }}@${{ steps.push-node.outputs.digest }}"
