environments:
  default: {}
  staging: {}
  production: {}

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 900
  createNamespace: true

releases:
  - name: corda-bootstrap
    chart: charts/corda-bootstrap
    namespace: corda
    values:
      - deploy/bootstrap/values.yaml

  - name: notary
    chart: charts/corda-node
    namespace: corda
    values:
      - deploy/notary/values.yaml
      {{- if eq .Environment.Name "production" }}
      - deploy/notary/values.prd.yaml
      {{- end }}
      - image:
          tag: {{ env "IMAGE_TAG" | default "" }}
    needs:
      - corda/corda-bootstrap

  - name: node1
    chart: charts/corda-node
    namespace: corda
    values:
      - deploy/node1/values.yaml
      {{- if eq .Environment.Name "production" }}
      - deploy/node1/values.prd.yaml
      {{- end }}
      - image:
          tag: {{ env "IMAGE_TAG" | default "" }}
    needs:
      - corda/corda-bootstrap

  - name: node2
    chart: charts/corda-node
    namespace: corda
    values:
      - deploy/node2/values.yaml
      {{- if eq .Environment.Name "production" }}
      - deploy/node2/values.prd.yaml
      {{- end }}
      - image:
          tag: {{ env "IMAGE_TAG" | default "" }}
    needs:
      - corda/corda-bootstrap
