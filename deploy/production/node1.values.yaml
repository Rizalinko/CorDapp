# Production values — Node1 (AcmeCorp counterparty A).
# Helm release name: node1
role: node

legalName: "O=AcmeCorp Node1, L=London, C=GB"
devMode: false

image:
  repository: ghcr.io/acmecorp/corda-node
  tag: "4.14.0"
  pullPolicy: IfNotPresent

jvm:
  opts: "-Xmx3g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"

db:
  type: postgresql
  host: corda-prod.postgres.database.azure.com
  port: 5432
  name: node1
  user: node1
  schema: node1

secrets:
  existingSecret: corda-node1-secrets

certificates:
  existingSecret: corda-node1-certs

network:
  existingNetworkParams: corda-network-params

config:
  mode: generate

persistence:
  enabled: true
  storageClass: managed-csi-premium
  size: 50Gi

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 4Gi

networkPolicy:
  enabled: true
  rpcAllowedFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: corda-ops

service:
  p2pType: ClusterIP
